name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 日本語の書体を入れる
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: テスト
        run: dotnet test tests/Tejun.Tests -c Release
        env:
          TEJUN_ARTIFACTS: ${{ runner.temp }}/artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-output
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: テスト
        run: dotnet test tests/Tejun.Tests -c Release
        env:
          TEJUN_ARTIFACTS: ${{ runner.temp }}\artifacts
      - name: 配布用の exe を作る
        run: dotnet publish src/Tejun.App -c Release -r win-x64 -o publish
      - name: 実際にクリックして記録を確かめる
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process -FilePath publish\TejunRecorder.exe -ArgumentList '--selftest', $out -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host 'timeout' }
          if (Test-Path "$out\selftest.log") { Get-Content "$out\selftest.log" -Encoding utf8 }
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: |
            ${{ runner.temp }}\selftest
            ${{ runner.temp }}\artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: TejunRecorder-win-x64
          path: publish/TejunRecorder.exe
      # Store の値（リポジトリの Variables）が未設定のときは、仮の値でパッケージが作れることだけ確かめる
      - name: Microsoft Store 用のパッケージを作る
        shell: pwsh
        run: |
          $opt = @{}
          if ($env:STORE_IDENTITY_NAME) { $opt.IdentityName = $env:STORE_IDENTITY_NAME }
          if ($env:STORE_PUBLISHER) { $opt.Publisher = $env:STORE_PUBLISHER }
          if ($env:STORE_PUBLISHER_DISPLAY_NAME) { $opt.PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME }
          if ($opt.Count -lt 3) { Write-Host '::warning::Store の値が未設定のため、仮の値で作りました。このパッケージは Store に提出できません' }
          ./packaging/msix/build.ps1 @opt
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: TejunRecorder-store-msix
          path: publish-store/*.msix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TejunRecorder-win-x64
      - name: リリースを作る
        run: gh release create "$GITHUB_REF_NAME" TejunRecorder.exe --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
